name: ER1991 Radar

on:
  workflow_dispatch:                # تشغيل يدوي من تبويب Actions
    inputs:
      symbols:
        description: "الرموز (فارغ = ما في config.json) مثال: EGX:COMI,EGX:SWDY,AAPL"
        required: false
        default: ""
      style:
        description: "أسلوب الاستثمار"
        required: false
        default: "Auto"
        type: choice
        options: [Auto, Value, Growth, Swing, "Medium Term", "Long Term"]
      market:
        description: "سوق الرموز المجردة"
        required: false
        default: "AUTO"
        type: choice
        options: [AUTO, US, EGX, TASI]
      lang:
        description: "لغة التقارير"
        required: false
        default: "عربي"
        type: choice
        options: ["عربي", "English"]
      deep:
        description: "التحليل المالي العميق"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      exports:
        description: "التصدير (مفصول بفواصل): html,excel,csv,pdf,png"
        required: false
        default: "html,excel,csv"
      publish_pages:
        description: "نشر التقرير على GitHub Pages (يصبح علنياً في المستودع العام)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # بعد إغلاق البورصة المصرية/السعودية (أحد–خميس 13:30 UTC) — عدّل أو احذف حسب رغبتك
    - cron: "30 13 * * 0-4"
    # بعد إغلاق السوق الأمريكي (اثنين–جمعة 21:45 UTC)
    - cron: "45 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: er1991-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: حزم النظام (PDF/PNG + خطوط)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 poppler-utils fonts-noto-core fonts-noto-color-emoji

      - name: حزم بايثون
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "git+https://github.com/rongardF/tvdatafeed.git" || echo "tvdatafeed غير متاح — اختياري"

      - name: اختبار ذاتي
        run: python run_radar.py --selftest

      - name: تشغيل الرادار
        env:
          RADAR_SYMBOLS: ${{ github.event.inputs.symbols }}
          RADAR_STYLE: ${{ github.event.inputs.style }}
          RADAR_MARKET: ${{ github.event.inputs.market }}
          RADAR_LANG: ${{ github.event.inputs.lang }}
          RADAR_DEEP: ${{ github.event.inputs.deep }}
          RADAR_EXPORTS: ${{ github.event.inputs.exports }}
        run: python run_radar.py --out-dir ER1991_Reports

      - name: ملخص على صفحة التشغيل
        if: always()
        run: |
          if [ -f ER1991_Reports/summary.md ]; then cat ER1991_Reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: رفع التقارير (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: er1991-reports
          path: ER1991_Reports/
          retention-days: 30
          if-no-files-found: warn

      - name: تجهيز موقع Pages
        if: ${{ success() && (github.event.inputs.publish_pages == 'true' || vars.PUBLISH_PAGES == 'true') }}
        run: |
          mkdir -p site
          cp ER1991_Reports/index.html site/index.html
          cp ER1991_Reports/ER1991_interactive_*.html site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        if: ${{ success() && (github.event.inputs.publish_pages == 'true' || vars.PUBLISH_PAGES == 'true') }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ success() && (github.event.inputs.publish_pages == 'true' || vars.PUBLISH_PAGES == 'true') }}
        with:
          path: site

    outputs:
      publish: ${{ (github.event.inputs.publish_pages == 'true' || vars.PUBLISH_PAGES == 'true') && 'true' || 'false' }}

  deploy-pages:
    needs: run
    if: ${{ needs.run.result == 'success' && needs.run.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
